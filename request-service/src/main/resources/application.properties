# 1. Nombre de la aplicación
spring.application.name=request-service

# 2. Puerto diferente al de pacientes (que usa el 8081)
server.port=8082

# 3. Configuración de Base de Datos H2 (Independiente)
spring.datasource.url=jdbc:h2:mem:requestdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# 4. Habilitar consola H2 para pruebas
spring.h2.console.enabled=true
# Ruta única para la documentación de solicitudes
springdoc.api-docs.path=/api/requests/v3/api-docs

# informacion de logs 
logging.level.com.redsalud.request_service=INFO

# Esto hace que Swagger genere las URLs usando el puerto del Gateway (8090)
server.forward-headers-strategy=framework