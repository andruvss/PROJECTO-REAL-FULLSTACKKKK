# Puerto del Gateway (BFF)
server.port=8090
spring.application.name=api-gateway-bff

# --- CONFIGURACIÓN DE RUTAS ---

# 1. Ruta hacia PACIENTES
spring.cloud.gateway.routes[0].id=patient-service
spring.cloud.gateway.routes[0].uri=http://localhost:8080
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/patients/**

# 2. Ruta hacia SOLICITUDES 
spring.cloud.gateway.routes[1].id=request-service
spring.cloud.gateway.routes[1].uri=http://localhost:8081
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/requests/**

# 3. Ruta hacia LISTA DE ESPERA 
spring.cloud.gateway.routes[2].id=waiting-list-service
spring.cloud.gateway.routes[2].uri=http://localhost:8082
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/waiting-list/**

# --- CONFIGURACIÓN CONTROLADOR DE ERRORES (Para que el Frontend no dé errores) ---
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOrigins=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=*

#importante para que el frontend no de error al hacer peticiones a este gateway
#Para ver pacientes: GET http://localhost:8090/api/patients (El BFF te llevará al 8080).
#Para ver solicitudes: GET http://localhost:8090/api/requests (El BFF te llevará al 8081).
#Para ver lista de espera: GET http://localhost:8090/api/waiting-list(El BFF te llevará al 8082).