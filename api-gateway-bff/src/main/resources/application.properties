server.port=8090
spring.application.name=api-gateway-bff
spring.main.web-application-type=reactive

# --- CONFIGURACIÓN DE SWAGGER ---
springdoc.swagger-ui.urls[0].name=Pacientes (8081)
springdoc.swagger-ui.urls[0].url=/api/patients/v3/api-docs
springdoc.swagger-ui.urls[1].name=Solicitudes (8082)
springdoc.swagger-ui.urls[1].url=/api/requests/v3/api-docs
springdoc.swagger-ui.urls[2].name=Lista de Espera (8083)
springdoc.swagger-ui.urls[2].url=/api/waiting-list/v3/api-docs

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.server-strategy=relative

# Conservar el Host original
spring.cloud.gateway.x-forwarded.host-enabled=true
spring.cloud.gateway.x-forwarded.port-enabled=true

# Eureka Client
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# --- RUTAS EXPLICÍTAS DEL GATEWAY (FILTRO JWT DESACTIVADO TEMPORALMENTE) ---
# 1. Ruta para autenticación (Ruta Pública)
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=lb://AUTH-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**

# 2. Ruta para Pacientes (Cambiado a índice [0] para evitar errores de bindings)
spring.cloud.gateway.routes[1].id=patient-service
spring.cloud.gateway.routes[1].uri=lb://PATIENT-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/patients/**
spring.cloud.gateway.routes[1].filters[0]=StripPrefix=1

# 3. Ruta para Solicitudes
spring.cloud.gateway.routes[2].id=request-service
spring.cloud.gateway.routes[2].uri=lb://REQUEST-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/requests/**
spring.cloud.gateway.routes[2].filters[0]=StripPrefix=1

# 4. Ruta para Lista de Espera
spring.cloud.gateway.routes[3].id=waiting-list-service
spring.cloud.gateway.routes[3].uri=lb://WAITING-LIST-SERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/waiting-list/**
spring.cloud.gateway.routes[3].filters[0]=StripPrefix=1

# --- CONFIGURACIÓN GLOBAL DE CORS NATIVA ---
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOrigins=http://localhost:5173
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowCredentials=true
spring.cloud.gateway.globalcors.cors-configurations.[/**].maxAge=3600

# LINEA CAMBIADA
spring.cloud.gateway.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST