server.port=8090
spring.application.name=api-gateway-bff

# Logging para ver qué pasa en la consola cuando llamas a la URL
logging.level.org.springframework.cloud.gateway=TRACE
logging.level.org.springframework.http.server.reactive=DEBUG

# --- RUTA PACIENTES ---
spring.cloud.gateway.routes[0].id=patient-service
spring.cloud.gateway.routes[0].uri=http://localhost:8081
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/patients/**

# --- RUTA SOLICITUDES ---
spring.cloud.gateway.routes[1].id=request-service
spring.cloud.gateway.routes[1].uri=http://localhost:8081
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/requests/**

# --- RUTA LISTA DE ESPERA ---
spring.cloud.gateway.routes[2].id=waiting-list-service
spring.cloud.gateway.routes[2].uri=http://localhost:8082
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/waiting-list/**

# --- CORS ---
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOrigins=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=*

# Configuración de Swagger para agregar los microservicios
springdoc.swagger-ui.urls[0].name=Pacientes y Solicitudes (8081)
springdoc.swagger-ui.urls[0].url=/api/patients/v3/api-docs
springdoc.swagger-ui.urls[1].name=Lista de Espera (8082)
springdoc.swagger-ui.urls[1].url=/api/waiting-list/v3/api-docs