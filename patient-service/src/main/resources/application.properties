# Configuración del Servidor
server.port=8081
spring.application.name=patient-service

# Configuración de Base de Datos H2 (en memoria para pruebas rápidas)
spring.datasource.url=jdbc:h2:mem:patientdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Mostrar el SQL en consola (útil para el informe de tu profe)
spring.jpa.show-sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Actualización automática de la tabla
spring.jpa.hibernate.ddl-auto=update



# Esto hace que la documentación esté disponible en la ruta exacta que busca el Gateway
springdoc.api-docs.path=/api/patients/v3/api-docs

# Esto hace que Swagger genere las URLs usando el puerto del Gateway (8090)
server.forward-headers-strategy=framework